name: Submodule Integrity Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  submodule-build-check:
    name: Verify submodule commits build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Verify submodule commits build in isolation
        run: |
          # Get all submodules from .gitmodules
          while IFS= read -r line; do
            if [[ $line =~ path\ =\ (.*) ]]; then
              submodule_path="${BASH_REMATCH[1]}"
              
              # Skip if submodule path doesn't exist
              if [ ! -d "$submodule_path" ]; then
                echo "⚠️  Submodule path not found: $submodule_path (likely optional or not initialized)"
                continue
              fi
              
              echo "🔍 Checking submodule: $submodule_path"
              
              # Check Rust project
              if [ -f "$submodule_path/Cargo.toml" ]; then
                echo "  → Rust project detected (Cargo.toml)"
                cd "$submodule_path" || exit 1
                
                echo "  → Running 'cargo check'..."
                if ! cargo check --all-targets 2>&1 | tail -20; then
                  echo "❌ FAILED: cargo check failed in $submodule_path"
                  cd - || exit 1
                  exit 1
                fi
                
                echo "  → Running 'cargo test --lib' (no integration tests, faster)..."
                if ! cargo test --lib --no-run 2>&1 | tail -20; then
                  echo "❌ FAILED: cargo test compilation failed in $submodule_path"
                  cd - || exit 1
                  exit 1
                fi
                
                cd - || exit 1
                echo "✅ Rust checks passed for $submodule_path"
              
              # Check Go project
              elif [ -f "$submodule_path/go.mod" ]; then
                echo "  → Go project detected (go.mod)"
                cd "$submodule_path" || exit 1
                
                echo "  → Running 'go build ./...'..."
                if ! go build ./... 2>&1 | tail -20; then
                  echo "❌ FAILED: go build failed in $submodule_path"
                  cd - || exit 1
                  exit 1
                fi
                
                echo "  → Running 'go vet ./...'..."
                if ! go vet ./... 2>&1 | tail -20; then
                  echo "❌ FAILED: go vet failed in $submodule_path"
                  cd - || exit 1
                  exit 1
                fi
                
                cd - || exit 1
                echo "✅ Go checks passed for $submodule_path"
              
              # Check Python project
              elif [ -f "$submodule_path/requirements.txt" ] || [ -f "$submodule_path/setup.py" ]; then
                echo "  → Python project detected"
                cd "$submodule_path" || exit 1
                
                echo "  → Creating venv and installing dependencies..."
                python -m venv .venv || exit 1
                source .venv/bin/activate || exit 1
                pip install --upgrade pip setuptools || exit 1
                
                if [ -f "requirements.txt" ]; then
                  pip install -r requirements.txt || exit 1
                fi
                
                if [ -f "setup.py" ]; then
                  pip install -e . || exit 1
                fi
                
                deactivate || exit 1
                rm -rf .venv
                
                cd - || exit 1
                echo "✅ Python dependency check passed for $submodule_path"
              
              else
                echo "⚠️  No build configuration found in $submodule_path (skipping)"
              fi
            fi
          done < .gitmodules

      - name: Summary
        if: success()
        run: echo "✅ All submodule integrity checks passed"
