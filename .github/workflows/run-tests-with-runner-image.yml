name: Run Workspace Tests With Runner Image

on:
  workflow_run:
    workflows: ["Build Runner Image"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull runner image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/workspace-test-runner:py3.13
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"

      - name: Run workspace tests inside runner image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/workspace-test-runner:py3.13
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace "$IMAGE" bash -lc "chmod +x ./run_workspace_tests.sh && ./run_workspace_tests.sh"

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-test-results
          path: |
            test_results.json
            test_logs
