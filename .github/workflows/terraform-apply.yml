name: Terraform — Plan & Apply (envs/prod)

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  pull_request:
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after a successful plan?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  TF_DIR: terraform/envs/prod
  GCP_REGION: us-central1

jobs:
  terraform:
    name: >-
      Terraform
      ${{ github.event_name == 'workflow_dispatch' && inputs.apply == 'true' && 'Plan & Apply' || 'Plan' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # required for OIDC token exchange with GCP WIF
      pull-requests: write  # for posting plan output as a PR comment

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate configuration
        id: config
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping: GCP_PROJECT_ID variable is not set."
            exit 0
          fi
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping: GCP_WORKLOAD_IDENTITY_PROVIDER secret is not set."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          # Check if Infracost API key is configured
          if [ -z "${{ secrets.INFRACOST_API_KEY }}" ]; then
            echo "infracost_enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "infracost_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        if: steps.config.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "~> 1.6"

      - name: Terraform init
        if: steps.config.outputs.enabled == 'true'
        run: |
          cd "${{ env.TF_DIR }}"
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=envs/prod"

      - name: Terraform validate
        if: steps.config.outputs.enabled == 'true'
        run: |
          cd "${{ env.TF_DIR }}"
          terraform validate

      - name: Terraform plan
        if: steps.config.outputs.enabled == 'true'
        id: plan
        run: |
          cd "${{ env.TF_DIR }}"
          terraform plan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -no-color 2>&1 | tee "${{ github.workspace }}/plan_output.txt"

      - name: Post plan output to PR
        if: steps.config.outputs.enabled == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('${{ github.workspace }}/plan_output.txt', 'utf8');
            const truncated = raw.length > 60000 ? raw.slice(0, 60000) + '\n...(truncated)' : raw;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Terraform Plan — \`envs/prod\`\n\`\`\`\n${truncated}\n\`\`\``,
            });

      # ---------------------------------------------------------------------------
      # Infracost cost estimate (v1.14.5).
      # Only runs on pull requests when INFRACOST_API_KEY is configured.
      # Posts a cost diff comment alongside the plan comment above.
      # ---------------------------------------------------------------------------
      - name: Setup Infracost
        if: >-
          steps.config.outputs.enabled == 'true' &&
          steps.config.outputs.infracost_enabled == 'true' &&
          github.event_name == 'pull_request'
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost cost estimate
        if: >-
          steps.config.outputs.enabled == 'true' &&
          steps.config.outputs.infracost_enabled == 'true' &&
          github.event_name == 'pull_request'
        run: |
          cd "${{ env.TF_DIR }}"
          infracost breakdown \
            --path . \
            --var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            --format json \
            --out-file "${{ github.workspace }}/infracost.json"
          infracost output \
            --path "${{ github.workspace }}/infracost.json" \
            --format github-comment \
            --out-file "${{ github.workspace }}/infracost-comment.md"

      - name: Post cost estimate to PR
        if: >-
          steps.config.outputs.enabled == 'true' &&
          steps.config.outputs.infracost_enabled == 'true' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('${{ github.workspace }}/infracost-comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

      - name: Terraform apply
        if: >-
          steps.config.outputs.enabled == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.apply == 'true'
        run: |
          cd "${{ env.TF_DIR }}"
          terraform apply \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -auto-approve
