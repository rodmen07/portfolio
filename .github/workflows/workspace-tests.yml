name: Workspace Tests (Python 3.13)

on:
  push:
  pull_request:

jobs:
  workspace-tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ git curl ca-certificates wget jq golang-go

      - name: Upgrade pip and install maturin
        run: |
          python -m pip install --upgrade pip setuptools wheel maturin

      - name: Run workspace test script
        run: |
          chmod +x ./run_workspace_tests.sh
          ./run_workspace_tests.sh

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-test-results
          path: |
            test_results.json
            test_logs/**
