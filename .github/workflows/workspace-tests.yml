name: Workspace Tests (Python 3.13)

on:
  push:
  pull_request:

jobs:
  workspace-tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ git curl ca-certificates wget jq golang-go

      - name: Upgrade pip and install maturin
        run: |
          python -m pip install --upgrade pip setuptools wheel maturin

      - name: Run workspace test script
        run: |
          chmod +x ./run_workspace_tests.sh
          ./run_workspace_tests.sh

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-test-results
          path: |
            test_results.json
            test_logs/**
