name: Release Consistency

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/ROADMAP.md"
      - "infraportal/src/pages/PatchNotesPage.tsx"
      - "scripts/check_release_consistency.py"
      - ".github/workflows/release-consistency.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/ROADMAP.md"
      - "scripts/check_release_consistency.py"
  workflow_dispatch:

jobs:
  release-consistency:
    name: README vs ROADMAP version parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check release consistency
        run: python scripts/check_release_consistency.py
