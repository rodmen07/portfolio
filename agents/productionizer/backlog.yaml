- id: backend-new-features-b8a8dd62
  dimension: backend-new-features
  title: Implement cursor-based pagination for tasks list endpoint
  description: 'Replace/augment offset pagination on `GET /tasks` in backend-service
    with cursor-based pagination keyed on `(created_at, id)`.


    Changes:

    - Update the list handler in `src/lib/` to accept `?cursor=<opaque>&limit=<n>`
    (max 100, default 25). Decode cursor as base64 of `"<created_at_iso>|<id>"`.

    - SQL query: `WHERE (created_at, id) < (:cursor_ts, :cursor_id) ORDER BY created_at
    DESC, id DESC LIMIT :limit + 1`.

    - Response: `{ "items": [...], "next_cursor": "..."|null }`. Compute `next_cursor`
    by peeking the (limit+1)th row.

    - Keep backward compat: if `?offset=` is passed, fall back to existing behavior
    with a deprecation header `Deprecation: true`.

    - Add tests for first page, mid-page, last page, and empty result in `tests/api_tasks.rs`.'
