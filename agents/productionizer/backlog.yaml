- id: backend-new-features-d71d8822
  dimension: backend-new-features
  title: Add internal service-to-service JWT auth in go-gateway
  description: 'Strengthen inter-service auth: have go-gateway mint short-lived internal
    JWTs and forward them to upstream services, which validate them.


    Changes in go-gateway:

    - Add `internal/middleware/internal_jwt.go` providing a middleware that mints
    an HS256 JWT with claims `{iss: "go-gateway", aud: "<upstream>", exp: now+60s,
    sub: <user_id_or_anonymous>, scope: <derived>}` using a shared secret from `INTERNAL_JWT_SECRET`
    env var.

    - In `internal/proxy/`, attach the token as `X-Internal-Auth: Bearer <jwt>` on
